kind = "web"
previewPath = "/"
title = "Aside Paving"
version = "1.0.0"
id = "artifacts/aside-paving"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20998

[services.development]
run = "pnpm --filter @workspace/aside-paving run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/aside-paving", "run", "build" ]
run = "pnpm --filter @workspace/aside-paving run serve"

[services.env]
PORT = "20998"
BASE_PATH = "/"
